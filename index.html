<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0e10">
<title>raza</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

<style>
:root{color-scheme:dark;--bg:#0e0e10;--surface:#151518;--raised:#1c1c22;--ink:#ececee;--soft:#a1a1a6;--faint:#6c6c72;--line:#222226;--strong:#323238;--accent:#9bb4d4;--green:#2e7d32;--danger:#e59a90;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;height:100%;font-family:var(--sans);font-size:16px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#hub{min-height:100vh;display:flex;justify-content:center;padding:0 20px}
.container{width:100%;max-width:640px;padding:36px 0 60px}
.masthead{padding-bottom:18px;border-bottom:1px solid var(--line)}
.wordmark{font-size:1.1rem;font-weight:700}
.intro{padding:40px 0 28px}
.title{font-size:clamp(1.6rem,5vw,2.15rem);font-weight:600;line-height:1.25;margin-bottom:14px}
.subtitle{font-size:.96rem;line-height:1.65;color:var(--soft)}
.form{position:relative;padding-bottom:30px}
.form:after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--strong)}
.field-label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:8px}
.input-group{display:flex;gap:8px}
.input-wrapper{position:relative;flex:1;min-width:0}
.input-wrapper input{width:100%;height:44px;background:var(--surface);border:1px solid var(--strong);border-radius:6px;padding:0 36px 0 12px;font-family:var(--mono);font-size:.82rem;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--accent)!important}
.input-wrapper input::placeholder{color:var(--faint)}
.clear-btn{position:absolute;right:8px;top:11px;background:transparent;border:0;color:var(--soft);padding:3px}
#goBtn{height:44px;padding:0 16px;background:var(--ink);color:var(--bg);border:0;border-radius:6px;font-size:.88rem;font-weight:600;white-space:nowrap}
button:disabled{opacity:.55;cursor:wait}
.sample-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.sample-label{font-size:.8rem;color:var(--faint)}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--soft);font-size:.76rem;padding:6px 10px;border-radius:99px}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.result{margin-top:22px}
.success{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--strong);border-radius:6px;padding:14px}
.result-label{font-size:.8rem;font-weight:600;color:var(--soft)}
.result-url-row{display:flex;gap:8px;align-items:center}
.result-url-row input{flex:1;min-width:0;height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.result-actions{display:flex;gap:8px}
.result-actions button{height:40px;padding:0 12px;background:transparent;border:1px solid var(--strong);border-radius:6px;color:var(--ink);font-size:.82rem}
#openBtn{background:#161c25;border-color:var(--accent);color:var(--accent)}
.code-meta-row{display:flex;justify-content:space-between;gap:10px;padding-top:4px}
.code-name{font-size:.82rem;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-pill{font-family:var(--mono);font-size:.72rem;padding:3px 7px;border-radius:4px;background:#161c25;color:var(--accent)}
.error{padding:12px;background:#281615;border-left:2px solid var(--danger);font-size:.88rem;line-height:1.5;color:var(--danger)}
.loader{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:.9rem}
.spinner,.spinner-lg{border:2px solid var(--strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.spinner{width:16px;height:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.runner{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.runner-frame{flex:1;width:100%;height:100%;border:0;background:white}
.runner-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.runner-error{max-width:420px;text-align:center;color:var(--soft);line-height:1.6}
.spinner-lg{width:26px;height:26px}
.playground{flex:1;min-height:0;display:flex;flex-direction:column}
.pg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.pg-info{min-width:0}
.pg-title{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-meta{font-size:.77rem;color:var(--faint)}
.pg-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 12px;background:transparent;border:1px solid var(--strong);border-radius:6px;color:var(--ink);font-size:.84rem;white-space:nowrap}
.btn.active{background:var(--raised)}
.btn-run{background:var(--green);border-color:var(--green);color:white;font-weight:600}
.input-panel{display:flex;flex-direction:column;gap:7px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.input-label{font-size:.78rem;color:var(--soft)}
.stdin{width:100%;padding:8px;background:var(--bg);border:1px solid var(--strong);border-radius:6px;color:var(--ink);font-family:var(--mono);font-size:14px}
.tabs{display:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{flex:1;height:40px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--faint)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.panel-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line)}
.file-name,.panel-title{font-size:.8rem;color:var(--soft)}
.file-name{font-family:var(--mono)}
.status{font-family:var(--mono);font-size:.75rem;color:var(--faint)}
.status.is-done{color:#81c784}.status.is-error{color:var(--danger)}
.editor{flex:1;min-height:0;display:flex;overflow:hidden}
.gutter{flex-shrink:0;width:38px;padding:12px 7px 12px 0;overflow:hidden;text-align:right;font:13px/20px var(--mono);color:var(--faint);user-select:none}
.gutter div{height:20px}
.code-area{position:relative;flex:1;min-width:0;min-height:0}
.code,.code-hl{position:absolute;inset:0;margin:0;padding:12px 10px 12px 4px;border:0;font:13px/20px var(--mono);tab-size:4;white-space:pre;overflow:auto}
.code{width:100%;height:100%;background:transparent;outline:none;color:var(--ink);caret-color:var(--ink);resize:none}
.code-hl{display:none;overflow:hidden;pointer-events:none}
.code-hl code.hljs{padding:0;background:transparent;font:inherit}
.code-area.has-hl .code-hl{display:block}
.code-area.has-hl .code{color:transparent}
.code-area.has-hl .code::selection{background:rgba(155,180,212,.25);color:transparent}
.output-body{flex:1;min-height:0;display:flex;flex-direction:column}
.output-text{flex:1;min-height:0;margin:0;padding:12px;overflow:auto;font:13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.output-text .muted{color:var(--faint)}.output-text .stderr{color:var(--danger)}
.output-body.has-frame .output-text{flex:0 1 auto;max-height:40%;border-bottom:1px solid var(--line)}
.output-frame{flex:1;min-height:0;width:100%;border:0;background:white}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:#0009}
.modal-box{width:100%;max-width:340px;padding:20px;background:var(--surface);border:1px solid var(--strong);border-radius:6px}
.modal-text{font-size:.95rem;line-height:1.5}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-btn{height:38px;min-width:80px;padding:0 14px;background:transparent;border:1px solid var(--strong);border-radius:6px;color:var(--ink)}
.modal-btn-primary{background:var(--ink);color:var(--bg)}
.hidden{display:none!important}
@media(max-width:820px){
.tabs{display:flex}.workspace{grid-template-columns:1fr}
.workspace[data-view="code"] .output-panel,.workspace[data-view="output"] .code-panel{display:none}
.panel-head{display:none}.pg-bar{padding:8px 10px}.btn{height:40px}
}
@media(max-width:560px){
.container{padding-top:28px}.intro{padding-top:32px}
.input-group,.result-url-row{flex-direction:column;align-items:stretch}
#goBtn{width:100%}.result-actions button{flex:1}
.code-meta-row{flex-direction:column;align-items:flex-start}
.pg-title{max-width:45vw}.pg-meta{max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main id="hub">
<div class="container">
<header class="masthead"><span class="wordmark">raza</span></header>
<section class="intro">
<h1 class="title">Share your SoloLearn code as a website</h1>
<p class="subtitle">Paste a code link below. You'll get a link anyone can open as a web page.</p>
</section>
<section class="form">
<label class="field-label" for="codeInput">SoloLearn Code Link or ID</label>
<div class="input-group">
<div class="input-wrapper">
<input id="codeInput" placeholder="Code ID or SoloLearn link" spellcheck="false" autocomplete="off">
<button id="clearBtn" class="clear-btn hidden" type="button" aria-label="Clear">×</button>
</div>
<button id="goBtn" type="button">Generate Link</button>
</div>
<div class="sample-chips">
<span class="sample-label">Try samples:</span>
<button class="chip" data-id="W0mqHl3iFTtd">Web: Night view</button>
<button class="chip" data-id="https://sololearn.com/compiler-playground/WtIQj37E71GO/?ref=app">Web: Spritesheet tutorial</button>
<button class="chip" data-id="c3ww2R6QAkl4">Python: Hello World</button>
<button class="chip" data-id="https://sololearn.com/compiler-playground/wPnz3RxAYhBh/?ref=app">PHP: AK</button>
<button class="chip" data-id="cmoK2T54RD33">Node: JSF Hello world</button>
<button class="chip" data-id="c7U6ZgEiZOh9">R: Global</button>
</div>
<div id="result" class="result hidden">
<div id="errorMsg" class="error hidden"></div>
<div id="successBlock" class="success hidden">
<span class="result-label">Your webpage link</span>
<div class="result-url-row">
<input id="resultUrl" readonly>
<div class="result-actions">
<button id="copyBtn" type="button">Copy Link</button>
<button id="openBtn" type="button">Open</button>
</div>
</div>
<div class="code-meta-row"><span id="codeName" class="code-name"></span><span id="codeLangBadge" class="lang-pill"></span></div>
</div>
<div id="loader" class="loader hidden"><div class="spinner"></div><span>Generating link...</span></div>
</div>
</section>
</div>
</main>

<section id="runner" class="runner hidden">
<iframe id="runnerFrame" class="runner-frame hidden" title="Web project" sandbox="allow-scripts allow-modals allow-forms allow-pointer-lock allow-downloads allow-same-origin"></iframe>
<div id="playground" class="playground hidden">
<header class="pg-bar">
<div class="pg-info"><h1 id="pgTitle" class="pg-title"></h1><span id="pgMeta" class="pg-meta"></span></div>
<div class="pg-actions">
<button id="inputToggle" class="btn" type="button" aria-expanded="false">Input</button>
<button id="runBtn" class="btn btn-run" type="button"><span>▶</span><span id="runLabel">Run</span></button>
</div>
</header>
<div id="inputPanel" class="input-panel hidden">
<label for="stdinInput" class="input-label">Input, one value per line</label>
<textarea id="stdinInput" class="stdin" rows="3" spellcheck="false"></textarea>
</div>
<nav class="tabs">
<button class="tab active" data-tab="code">Code</button>
<button class="tab" data-tab="output">Output</button>
</nav>
<div id="workspace" class="workspace" data-view="code">
<section class="panel code-panel">
<div class="panel-head"><span id="fileName" class="file-name"></span></div>
<div class="editor">
<div id="lineNumbers" class="gutter"></div>
<div id="codeArea" class="code-area">
<pre class="code-hl"><code id="codeHl" class="hljs"></code></pre>
<textarea id="codeTextarea" class="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
</div>
</div>
</section>
<section class="panel output-panel">
<div class="panel-head"><span class="panel-title">Output</span><span id="runStatus" class="status"></span></div>
<div id="outputBody" class="output-body">
<pre id="outputText" class="output-text"></pre>
<iframe id="outputFrame" class="output-frame hidden" title="Output" sandbox="allow-scripts allow-popups allow-modals allow-forms"></iframe>
</div>
</section>
</div>
</div>
<div id="runnerLoader" class="runner-state"><div class="spinner-lg"></div></div>
<div id="runnerError" class="runner-state hidden"><p id="runnerErrorMsg" class="runner-error">Could not load this code.</p></div>
</section>

<div id="openModal" class="modal hidden" role="dialog" aria-modal="true">
<div class="modal-box">
<p class="modal-text">This will open in your browser.</p>
<div class="modal-actions">
<button id="modalCancel" class="modal-btn" type="button">Cancel</button>
<button id="modalConfirm" class="modal-btn modal-btn-primary" /type="button">Open</button>
</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const hub=$('hub'),runner=$('runner'),frame=$('runnerFrame'),playground=$('playground');
const editor=$('codeTextarea'),gutter=$('lineNumbers'),highlight=$('codeHl');
const stdin=$('stdinInput'),runBtn=$('runBtn'),status=$('runStatus'),output=$('outputText');
const outputFrame=$('outputFrame'),codeInput=$('codeInput'),resultUrl=$('resultUrl'),modal=$('openModal');
const homeTitle=document.title;
let code=null,blobUrl=null,hlLang=null,running=false;

/* Your GitHub Pages URL */
const BASE_URL='https://kakasidmshatake-codehub.github.io/Raza-coder/';

const langs={
py:['Python','main.py','python'],cpp:['C++','main.cpp','cpp'],c:['C','main.c','c'],
cs:['C#','Program.cs','csharp'],java:['Java','Program.java','java'],kt:['Kotlin','Main.kt','kotlin'],
swift:['Swift','main.swift','swift'],rb:['Ruby','main.rb','ruby'],php:['PHP','index.php','php'],
go:['Go','main.go','go'],node:['JavaScript','index.js','javascript'],web:['Web','index.html',null]
};
const aliases={python:'py','c++':'cpp',csharp:'cs','c#':'cs',kotlin:'kt',ruby:'rb',golang:'go',js:'node',javascript:'node',html:'web'};

function langInfo(raw){
let key=(raw||'').toLowerCase().trim();key=aliases[key]||key;
const [name,file,hl]=langs[key]||[key.toUpperCase()||'Code','main.txt',null];
return{name,file,hl,isWeb:key==='web'};
}

function extractId(input){
const s=input.trim();
const m=s.match(/compiler-playground\/(?:id\/)?([\w-]+)/i)||s.match(/#([\w-]{4,})/)||s.match(/^([\w-]{4,})(?:[?&#]|$)/);
return m?m[1]:null;
}
function shareUrl(id){return `${BASE_URL}#${encodeURIComponent(id)}`;}

function parsePage(html){
const m=html.match(/window\.initialData\s*=\s*(\{[\s\S]*?\})\s*;?\s*<\/script>/);
if(!m)return null;
try{return JSON.parse(m[1]).ssrUserCode?.data;}catch{return null;}
}

async function fetchCode(id){
const api=`https://api2.sololearn.com/v2/codeplayground/usercodes/${encodeURIComponent(id)}`;
const page=`https://www.sololearn.com/compiler-playground/${encodeURIComponent(id)}`;
const proxy=url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
const sources=[
[api,async r=>(await r.json()).data],
[proxy(api),async r=>(await r.json()).data],
[page,async r=>parsePage(await r.text())],
[proxy(page),async r=>parsePage(await r.text())]
];
for(const [url,read] of sources){
try{
const res=await fetch(url);
if(!res.ok)continue;
const data=await read(res);
if(data)return data;
}catch{}
}
throw new Error('Could not load this code. Check the ID, internet connection, and whether the SoloLearn code is public.');
}

function buildPage({sourceCode,cssCode,jsCode,name}){
const style=cssCode?`<style>\n${cssCode}\n</style>`:'';
const script=jsCode?`<script>\n${jsCode}\n<\/script>`:'';
let doc=(sourceCode||'').trim();
const hasHead=/<head[^>]*>/i.test(doc),hasBody=/<body[^>]*>/i.test(doc);
if(!hasHead&&!hasBody){
const title=(name||'').replace(/</g,'&lt;');
return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title>${style}</head><body>${doc}${script}</body></html>`;
}
doc=hasHead?doc.replace(/<\/head>/i,`${style}\n</head>`):style+doc;
doc=hasBody?doc.replace(/<\/body>/i,`${script}\n</body>`):doc+script;
return doc;
}

function showWeb(data){
if(blobUrl)URL.revokeObjectURL(blobUrl);
blobUrl=URL.createObjectURL(new Blob([buildPage(data)],{type:'text/html'}));
frame.src=blobUrl;
frame.classList.remove('hidden');
}

function splitHtml(text){
const start=text.search(/<!doctype html|<html[\s>]/i);
if(start!==-1)return[text.slice(0,start),text.slice(start)];
if(/^<[a-z!][\s\S]*>$/i.test(text.trim()))return['',text.trim()];
return[text,''];
}
function print(text,cls){
const span=document.createElement('span');if(cls)span.className=cls;
span.textContent=text;output.appendChild(span);
}
function clearOutput(message){
$('outputBody').classList.remove('has-frame');
outputFrame.classList.add('hidden');outputFrame.removeAttribute('srcdoc');
output.classList.remove('hidden');output.textContent='';
if(message)print(message,'muted');
}
function showOutput(stdout,stderr){
clearOutput();
const [text,html]=splitHtml(stdout||'');
const out=text.trimEnd(),err=(stderr||'').trimEnd();
if(out)print(out+'\n');if(err)print(err+'\n','stderr');
if(html){
const css='<style>html,body{margin:0;padding:8px}img,video,canvas,svg{max-width:100%;height:auto}</style>';
$('outputBody').classList.add('has-frame');outputFrame.classList.remove('hidden');
outputFrame.srcdoc=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+css):css+html;
if(!out&&!err)output.classList.add('hidden');
}else if(!out&&!err)print('No output.','muted');
}
function setStatus(text,state){
status.textContent=text;status.className=state?`status is-${state}`:'status';
}
async function compile(){
const res=await fetch('https://api2.sololearn.com/v2/codeplayground/v2/compile',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({codeId:code.id||0,language:code.language||'py',code:editor.value,input:stdin.value})
});
if(!res.ok)throw new Error(`Compiler returned HTTP ${res.status}`);
const json=await res.json();
if(!json.success&&json.errors?.length)throw new Error(json.errors.join('; '));
return json.data||{};
}
async function run(){
if(running||!code)return;
running=true;runBtn.disabled=true;$('runLabel').textContent='Running';setStatus('Running');clearOutput('Running...');showTab('output');
const start=performance.now();
try{
const {output:stdout,error}=await compile();showOutput(stdout,error);
setStatus(((performance.now()-start)/1000).toFixed(2)+'s',error?.trim()?'error':'done');
}catch(err){clearOutput();print(err.message,'stderr');setStatus('Error','error');}
running=false;runBtn.disabled=false;$('runLabel').textContent='Run';
}
function syncScroll(){
gutter.scrollTop=editor.scrollTop;highlight.parentElement.scrollTop=editor.scrollTop;
highlight.parentElement.scrollLeft=editor.scrollLeft;
}
function refreshEditor(){
const text=editor.value;
gutter.innerHTML=text.split('\n').map((_,i)=>`<div>${i+1}</div>`).join('');
const canHighlight=!!(window.hljs&&hlLang&&hljs.getLanguage(hlLang));
$('codeArea').classList.toggle('has-hl',canHighlight);
if(canHighlight)highlight.innerHTML=hljs.highlight(text.endsWith('\n')?text+' ':text,{language:hlLang}).value;
syncScroll();
}
function showTab(name){
$('workspace').dataset.view=name;
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
}
function setInputOpen(open){
$('inputPanel').classList.toggle('hidden',!open);
$('inputToggle').classList.toggle('active',open);
$('inputToggle').setAttribute('aria-expanded',String(open));
if(open)stdin.focus();
}
function showPlayground(data){
const lang=langInfo(data.language);
$('pgTitle').textContent=data.name||'Untitled';
$('pgMeta').textContent=`${data.userName||'Anonymous'} · ${lang.name}`;
$('fileName').textContent=lang.file;hlLang=lang.hl;
editor.value=data.sourceCode||'';refreshEditor();stdin.value='';
setInputOpen(false);setStatus('');clearOutput('Press Run to see the output.');
showTab('code');playground.classList.remove('hidden');
}
async function openRunner(id){
hub.classList.add('hidden');runner.classList.remove('hidden');
frame.classList.add('hidden');playground.classList.add('hidden');
$('runnerError').classList.add('hidden');$('runnerLoader').classList.remove('hidden');
try{
code=await fetchCode(id);document.title=code.name||'Code';
if(langInfo(code.language).isWeb)showWeb(code);else showPlayground(code);
}catch(err){$('runnerErrorMsg').textContent=err.message;$('runnerError').classList.remove('hidden');}
$('runnerLoader').classList.add('hidden');
}
function closeRunner(){
runner.classList.add('hidden');hub.classList.remove('hidden');frame.src='about:blank';
if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;code=null;document.title=homeTitle;
}
function showResult(state){
$('result').classList.remove('hidden');
$('errorMsg').classList.toggle('hidden',state!=='error');
$('successBlock').classList.toggle('hidden',state!=='success');
$('loader').classList.toggle('hidden',state!=='loading');
}
function showError(message){$('errorMsg').textContent=message;showResult('error');}

async function generate(){
const id=extractId(codeInput.value);
if(!id)return showError('Please enter a valid SoloLearn code link or code ID.');
showResult('loading');$('goBtn').disabled=true;
try{
const data=await fetchCode(id);
resultUrl.value=shareUrl(id);
$('codeName').textContent=data.name?`${data.name} by ${data.userName||'anonymous'}`:'Untitled';
$('codeLangBadge').textContent=langInfo(data.language).name;
showResult('success');
}catch(err){showError(err.message);}
$('goBtn').disabled=false;
}
function updateClearBtn(){$('clearBtn').classList.toggle('hidden',!codeInput.value);}
function closeModal(){modal.classList.add('hidden');$('openBtn').focus();}

editor.addEventListener('input',refreshEditor);
editor.addEventListener('scroll',syncScroll);
editor.addEventListener('keydown',e=>{
if(e.key!=='Tab')return;
e.preventDefault();editor.setRangeText('    ',editor.selectionStart,editor.selectionEnd,'end');refreshEditor();
});
runBtn.addEventListener('click',run);
$('inputToggle').addEventListener('click',()=>setInputOpen($('inputPanel').classList.contains('hidden')));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab)));
$('clearBtn').addEventListener('click',()=>{codeInput.value='';updateClearBtn();codeInput.focus();});
codeInput.addEventListener('input',updateClearBtn);
codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')generate();});
$('goBtn').addEventListener('click',generate);
document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{
codeInput.value=chip.dataset.id;updateClearBtn();generate();
}));

$('copyBtn').addEventListener('click',async()=>{
try{
await navigator.clipboard.writeText(resultUrl.value);
$('copyBtn').textContent='Copied';
setTimeout(()=>$('copyBtn').textContent='Copy Link',1500);
}catch{
resultUrl.focus();resultUrl.select();
try{document.execCommand('copy');$('copyBtn').textContent='Copied';setTimeout(()=>$('copyBtn').textContent='Copy Link',1500);}
catch{alert('Please copy the selected link manually.');}
}
});
$('openBtn').addEventListener('click',()=>modal.classList.remove('hidden'));
$('modalConfirm').addEventListener('click',()=>{
closeModal();
const url=resultUrl.value;
const opened=window.open(url,'_blank');
if(!opened)location.href=url;
});
$('modalCancel').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&!modal.classList.contains('hidden'))closeModal();
if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!playground.classList.contains('hidden')){e.preventDefault();run();}
});

function route(){
let id;
try{id=extractId(decodeURIComponent(location.hash.slice(1)));}catch{id=extractId(location.hash.slice(1));}
if(id)openRunner(id);else closeRunner();
}
updateClearBtn();
window.addEventListener('hashchange',route);
if(location.hash.length>1)route();else closeRunner();
})();
</script>
</body>
